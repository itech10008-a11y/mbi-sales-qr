<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FA8C00"><title>صنایع پخت مشهد | S01</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f6f6f6,#ececec);color:#333;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.12)}.top{height:12px;background:#FA8C00}.content{padding:30px 28px 26px;text-align:center}.brand{font-size:21px;font-weight:900;color:#555}.code{margin-top:7px;color:#999;font:700 13px/1.4 monospace;letter-spacing:1px}.avatar{width:108px;height:108px;border-radius:50%;margin:26px auto 18px;background:linear-gradient(135deg,#FA8C00,#ffb55c);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}h1{font-size:25px;margin:0 0 7px}.title{font-size:15px;font-weight:700;color:#666}.market{font-size:13px;color:#999;margin-top:5px}.actions{display:grid;gap:10px;margin-top:24px}.btn{display:block;text-decoration:none;border-radius:14px;padding:14px 16px;font-weight:800;border:1px solid #e5e5e5;color:#333;background:#fff}.btn.primary{background:#FA8C00;color:#fff;border-color:#FA8C00}.meta{margin-top:18px;padding-top:18px;border-top:1px solid #eee;display:grid;gap:7px;font-size:13px;color:#666}.footer{padding:16px 24px;background:#fafafa;color:#8a8a8a;font-size:12px;line-height:1.8;text-align:center}.hidden{display:none!important}</style></head><body><main class="card"><div class="top"></div><section class="content"><div id="company" class="brand">صنایع پخت مشهد</div><div id="code" class="code">SALES • S01</div><div id="avatar" class="avatar">S01</div><h1 id="name">کارشناس فروش</h1><div id="title" class="title">کارشناس فروش</div><div id="market" class="market">فروش داخلی</div><div class="actions"><a id="call" class="btn primary" href="#">☎ تماس</a><a id="wa" class="btn hidden" href="#" target="_blank" rel="noopener">💬 WhatsApp</a><a id="email" class="btn" href="#">✉ ایمیل</a><a id="web" class="btn" href="#" target="_blank" rel="noopener">🌐 وب‌سایت</a></div><div class="meta"><div id="ext" class="hidden"></div></div></section><div class="footer">این QR متعلق به جایگاه فروش S01 است؛ با تغییر کارشناس، QR ثابت باقی می‌ماند.</div></main><script>fetch('../data/s01.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('company').textContent=d.company||'صنایع پخت مشهد';document.getElementById('code').textContent='SALES • '+(d.code||'S01');document.getElementById('name').textContent=d.name||'کارشناس فروش';document.getElementById('title').textContent=d.title||'';document.getElementById('market').textContent=d.market||'';const a=document.getElementById('avatar');if(d.photo){a.innerHTML='<img src="'+d.photo+'" alt="">'}else{a.textContent=d.code||'S01'};const call=document.getElementById('call');call.href='tel:'+String(d.mobile||'').replace(/\s+/g,'');call.textContent='☎ '+(d.mobile||'تماس');const email=document.getElementById('email');email.href='mailto:'+(d.email||'');email.textContent='✉ '+(d.email||'ایمیل');const web=document.getElementById('web');web.href=d.website||'https://mbico.com';const wa=document.getElementById('wa');if(d.whatsapp){wa.classList.remove('hidden');wa.href='https://wa.me/'+String(d.whatsapp).replace(/\D/g,'')}const ext=document.getElementById('ext');if(d.extension){ext.classList.remove('hidden');ext.textContent='داخلی: '+d.extension}}).catch(()=>{});</script></body></html>
